# Release check: what has to hold before a version tag becomes a release.
#
# Runs on every pushed `v*` tag and on demand. It reads nothing from the
# repository settings: no secret, no environment, a read-only token. The
# orchestrator that cuts a release waits for this workflow to be green before
# it opens the pull request that moves the plugin marketplace to the new tag.
#
# What it checks, in order:
#
#   1. Every place that names the package version agrees
#      (scripts/check-version.sh). On a tag push the tag is compared too; on a
#      manual run from a branch there is no tag, so only the files are.
#   2. Every frozen golden directory still matches its SHA256SUMS, and the
#      frozen and golden contract tests pass with sqlite-vec loaded.
#   3. The plugin manifest tests and `claude plugin validate --strict` pass on
#      plugin/claude-code.
#   4. The sdist and the wheel build, and the sdist carries only the package
#      (tests/test_sdist_contents.py).
#
# A manual run uses the workflow file of the ref it is dispatched on, so
# `gh workflow run release-check.yml --ref main` works and
# `--ref v0.6.0` does not (the tag predates this file).
#
# tests/test_pipeline_contract.py fails the suite if a trigger is added or
# dropped, if this file reads a secret or if an action is not pinned to a SHA.

name: release-check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: "Release check: version, frozen goldens, plugin, sdist"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KNOWLEDGE_REQUIRE_SQLITE_VEC: "1"
      UV_MANAGED_PYTHON: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.10.4/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # On a tag push the ref name is the tag and is compared with the files; on
      # a manual run from a branch the ref name is a branch, which the script
      # would reject as a tag, so it runs without an argument.
      - name: Check that every version agrees
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            scripts/check-version.sh "$REF_NAME"
          else
            scripts/check-version.sh
          fi
      - name: Check the frozen goldens
        run: |
          set -eu
          sums=$(find tests/golden -name SHA256SUMS | sort)
          test -n "$sums" || { echo "no SHA256SUMS under tests/golden" >&2; exit 1; }
          for file in $sums; do
            (cd "$(dirname "$file")" && sha256sum -c SHA256SUMS)
          done
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q tests/test_contract_frozen.py tests/test_contract_golden.py tests/test_plugin_manifest.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate the plugin
        run: claude plugin validate --strict plugin/claude-code
      - name: Build the sdist and the wheel
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Check what the sdist and the wheel carry
        run: uv run pytest -q tests/test_sdist_contents.py
