# Memory stack for Dokploy (project "Tools > Knowledge & Memory").
#
# Dokploy clones this repo and runs this compose with the repo root as
# build context. Secrets come from the compose environment configured in
# Dokploy (never committed): MCP_API_KEY, MCP_ADMIN_KEY, MCP_WEBHOOK_SECRET,
# OPENAI_API_KEY, TYPESAFE_API_KEY, GIT_DEPLOY_KEY_B64, POSTGRES_PASSWORD,
# MEMORY_*.
#
# No host port is published. The Traefik of Dokploy terminates TLS with Let's
# Encrypt certificates and routes https://mcp.cloudfrog.com.mx to knowledge-mcp
# and https://memory.cloudfrog.com.mx to memory-cloud; ports 8200 and 18082 are
# closed. Another deployment on this host holds 8100 and 18081, so a ports:
# entry added here must not claim either one.
#
# The vault is the cloudfroghq/vault repository, cloned whole into the
# vault-cloudfrog volume with a read-only deploy key (GIT_DEPLOY_KEY_B64). Its
# root is the vault, and its vault.yaml carries the review thresholds, so no
# config.json is mounted. The push webhook of that repository calls
# /webhook/reindex, signed with MCP_WEBHOOK_SECRET: the route pulls the clone
# and reindexes incrementally. The volume is a new one on purpose: the volume
# that held the clone of this code repository keeps that worktree (and its
# untracked files), which adopting it would carry into the vault.
#
# The index (index.sqlite and its sidecars) lives in the knowledge-index
# volume, at KNOWLEDGE_INDEX_DIR. knowledge-chroma stays mounted only as the
# source migrate-index reads on start: when /data/index/cloudfrog has no index
# yet, it copies usage_stats.json and the learned weights of link_graph.json
# from /data/chroma, and never reads or deletes Chroma's own files. Once the
# start log shows "outcome": "migrated", that volume can be unmounted.
#
# Dokploy orchestrates with Swarm, but it runs THIS file through
# `docker compose`, not through `docker stack deploy`. The stack schema
# refuses `pull_policy` ("additional property 'pull_policy' is not allowed")
# and accepts `depends_on` only as a plain list ("depends_on: must be a
# list"), and it never builds: `build:` earns "Ignoring unsupported options:
# build" and the service then dies on "no image specified". A stack deploy of
# this file cannot even parse, let alone produce a running knowledge-mcp, so
# Compose semantics are the ones in force and `restart`, `depends_on` with a
# health condition and `pull_policy` all take effect as written. A `deploy:`
# section would only describe an orchestration path this file never takes.
services:
  knowledge-mcp:
    build:
      context: ..
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8000"
      VAULT_PATH: /data/vault-repo
      VAULT_REMOTE: git@github.com:cloudfroghq/vault.git
      VAULT_BRANCH: main
      KNOWLEDGE_INDEX_DIR: /data/index/cloudfrog
      # Migration source only: KNOWLEDGE_INDEX_DIR wins as the index directory.
      CHROMA_PERSIST_DIR: /data/chroma
      # MCP_API_KEY is the read bearer of the clients; MCP_ADMIN_KEY, distinct
      # from it, is the only one that can call reindex, sync_confluence or a
      # manual POST /webhook/reindex.
      MCP_API_KEY: ${MCP_API_KEY}
      MCP_ADMIN_KEY: ${MCP_ADMIN_KEY}
      MCP_WEBHOOK_SECRET: ${MCP_WEBHOOK_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # The vault manifest names the rerank key variable with its slug prefix
      # (rerank.key_env: CLOUDFROG_TYPESAFE_API_KEY) while Dokploy stores the
      # secret under the short name TYPESAFE_API_KEY. Unset, it stays empty and
      # the server only warns (W_RERANK_KEY_MISSING).
      CLOUDFROG_TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      GIT_DEPLOY_KEY_B64: ${GIT_DEPLOY_KEY_B64}
    # The entrypoint owns what the server cannot recover from on its own: the
    # deploy key, safe.directory, adopting or cloning the vault, and the loud
    # VAULT_PATH check (see infra/bootstrap-vault.sh). VAULT_REMOTE is set, so
    # every start fetches the vault repository before serving.
    #
    # The image carries no config.json and none is mounted: review.thresholds_days
    # (get_stale_docs, search's needs_review) comes from the vault.yaml at the
    # root of the clone.
    command: ["knowledge-bootstrap"]
    volumes:
      - knowledge-index:/data/index
      - knowledge-chroma:/data/chroma
      - vault-cloudfrog:/data/vault-repo
    networks:
      - memory-net

  memory-cloud:
    # The default is the moving `latest` tag, because this deployment wants
    # whatever release is newest. `pull_policy: always` is what makes a moving
    # tag mean that: Compose does not re-pull a tag whose image is already
    # local, and does not recreate a service whose config hash is unchanged, so
    # without the forced pull a moving tag leaves the service on whatever image
    # the host happens to have cached.
    #
    # Rollback path: set MEMORY_IMAGE_TAG to an exact published version, e.g.
    # `v1.0.3`, so the deploy names one immutable image instead of a pointer.
    #
    # The GHCR package is private: the pull needs a registry credential
    # configured in the Dokploy panel. No token belongs in this file.
    image: ghcr.io/horacioespinosa/memory:${MEMORY_IMAGE_TAG:-latest}
    pull_policy: always
    # `cloud serve` opens the pool, pings postgres with a 5s deadline and, on
    # failure, prints `memory: cloudstore: ping postgres: ...` and exits 1.
    # There is no reconnect loop, so a postgres that is not yet accepting
    # connections is a hard startup failure. The health condition is what
    # keeps that from happening and the restart policy is what recovers the
    # container if postgres goes away later.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMORY_DATABASE_URL: postgres://memory:${POSTGRES_PASSWORD}@postgres:5432/memory_cloud?sslmode=disable
      MEMORY_JWT_SECRET: ${MEMORY_JWT_SECRET}
      MEMORY_CLOUD_TOKEN: ${MEMORY_CLOUD_TOKEN}
      MEMORY_CLOUD_ADMIN: ${MEMORY_CLOUD_ADMIN}
      MEMORY_CLOUD_TOKEN_PEPPER: ${MEMORY_CLOUD_TOKEN_PEPPER}
      # This server is single-user, behind a bearer token (MEMORY_CLOUD_TOKEN):
      # the wildcard lets it replicate every project enrolled locally instead
      # of gatekeeping by name. The Dokploy panel's MEMORY_CLOUD_ALLOWED_PROJECTS
      # variable does not reach this service — the value is fixed here.
      MEMORY_CLOUD_ALLOWED_PROJECTS: "*"
      MEMORY_CLOUD_HOST: 0.0.0.0
      MEMORY_PORT: "18080"
      # Enables replication of project-profile entities (project cards, tasks,
      # evidence, benchmarks); off by default.
      MEMORY_PROJECTS_SYNC: "1"
    command: ["cloud", "serve"]
    networks:
      - memory-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: memory_cloud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - memory-pg:/var/lib/postgresql/data
    # No host port: only reachable from the compose network.
    networks:
      - memory-net

# The three services share one named network instead of relying on the
# implicit default. The implicit default is silent: anything that attaches a
# service elsewhere leaves it without it, and a container on no user-defined
# network falls back to Docker's default bridge, which carries no service
# discovery and copies the host's /etc/resolv.conf. The name `postgres` then
# travels to the host stub resolver (`lookup postgres on 127.0.0.53:53`)
# instead of Docker's embedded DNS at 127.0.0.11, and no lookup can succeed.
#
# The driver stays unset on purpose. `docker compose` creates a network with
# no driver as `bridge` (scope local) and `docker stack deploy` creates the
# same declaration as `overlay` (scope swarm); naming a driver is what would
# tie the file to one of the two deployment modes.
networks:
  memory-net:

volumes:
  knowledge-index:
  knowledge-chroma:
  vault-cloudfrog:
  memory-pg:
